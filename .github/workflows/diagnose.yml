name: Diagnose live site
# Reads the shop and its Supabase project from GitHub's network (the development sandbox cannot reach them).
# Prints status lines, headers and the first part of each body; nothing secret is requested or shown.
on:
  workflow_dispatch:
    inputs:
      page:
        description: "Builder page slug to check (e.g. -atv)"
        default: "-atv"
      product:
        description: "Product slug to check"
        default: "cfmoto-gladiator-c4-g4"
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Site home page
        run: |
          curl -sS -i --max-time 30 -A "diagnose" "https://motodvorak.bilguun17481.workers.dev/" | head -40 || true
      - name: Health endpoint (raw)
        run: |
          curl -sS -i --max-time 30 -A "diagnose" "https://motodvorak.bilguun17481.workers.dev/api/health/?page=${{ github.event.inputs.page || '-atv' }}" | head -80 || true
          echo; echo "--- product ---"
          curl -sS -i --max-time 30 -A "diagnose" "https://motodvorak.bilguun17481.workers.dev/api/health/?product=${{ github.event.inputs.product || 'cfmoto-gladiator-c4-g4' }}" | head -80 || true
      - name: Supabase project (no key sent)
        run: |
          echo "--- auth health ---"; curl -sS -i --max-time 30 "https://thsqnfdrmqflvguzktnh.supabase.co/auth/v1/health" | head -20 || true
          echo; echo "--- rest root ---"; curl -sS -i --max-time 30 "https://thsqnfdrmqflvguzktnh.supabase.co/rest/v1/" | head -20 || true
          echo; echo "--- storage object (public file) ---"; curl -sS -I --max-time 30 "https://thsqnfdrmqflvguzktnh.supabase.co/storage/v1/object/public/media/images/C4-G4/1789105472683-cfmoto_cforce-c4_outdoor_11_a.jpg" | head -12 || true
          echo; echo "--- DNS ---"; getent hosts thsqnfdrmqflvguzktnh.supabase.co || echo "no DNS answer"
